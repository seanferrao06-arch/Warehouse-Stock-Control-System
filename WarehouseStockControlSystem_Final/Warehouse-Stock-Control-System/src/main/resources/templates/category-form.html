<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/common :: head('Edit Category')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('products')}"></nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-top border-4 border-secondary">
                <div class="card-header bg-white py-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-folder-check text-primary fs-5"></i>
                        <span class="fw-bold">Edit Category: <span th:text="${category.name}" class="text-primary">Category</span></span>
                    </div>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/products}">
                        <i class="bi bi-arrow-left"></i> Back to Products
                    </a>
                </div>
                <div class="card-body p-4">
                    <div th:replace="~{fragments/common :: flash}"></div>

                    <form th:action="@{/categories/{id}(id=${category.categoryId})}" th:object="${categoryForm}" method="post" class="needs-validation" novalidate>
                        <div class="mb-4">
                            <label class="form-label" for="categoryName">Category Name <span class="text-danger">*</span></label>
                            <input class="form-control" id="categoryName" th:field="*{name}" required>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            <div class="invalid-feedback">Category name is required.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <a class="btn btn-outline-secondary" th:href="@{/products}">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-check-circle"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
