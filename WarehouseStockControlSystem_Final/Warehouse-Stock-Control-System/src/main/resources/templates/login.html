<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Sign in')}"></head>
<body class="login-shell d-flex align-items-center justify-content-center p-3">
<main class="card login-card p-4 p-md-5">
    <div class="text-center mb-4">
        <div class="brand-mark mx-auto mb-3" style="width:52px;height:52px;font-size:1.6rem;border-radius:14px;">
            <i class="bi bi-boxes"></i>
        </div>
        <h1 class="h3 page-heading mb-1">Warehouse Stock Control</h1>
        <p class="text-muted small mb-0">Sign in to access inventory operations and audit logs</p>
    </div>

    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-4" th:if="${param.error}" role="alert">
        <i class="bi bi-exclamation-circle-fill fs-5 text-danger"></i>
        <div>Invalid username or password. Please try again.</div>
    </div>
    <div class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-4" th:if="${param.logout}" role="alert">
        <i class="bi bi-check-circle-fill fs-5 text-success"></i>
        <div>You have been safely signed out.</div>
    </div>

    <form th:action="@{/login}" method="post" class="needs-validation" novalidate id="loginForm">
        <div class="mb-3">
            <label class="form-label" for="loginUsername">
                <i class="bi bi-person me-1 text-muted"></i>Username
            </label>
            <input class="form-control form-control-lg" id="loginUsername" name="username" autocomplete="username" placeholder="Enter username" autofocus required>
            <div class="invalid-feedback">Username is required.</div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="loginPassword">
                <i class="bi bi-lock me-1 text-muted"></i>Password
            </label>
            <input class="form-control form-control-lg" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
            <div class="invalid-feedback">Password is required.</div>
        </div>

        <button class="btn btn-primary btn-lg w-100 py-2 fw-bold" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
        </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
        <span class="text-muted small d-block mb-2">Quick Demo Fill (1-Click):</span>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button type="button" class="demo-chip btn btn-sm" onclick="quickFill('admin', 'admin123')">
                <i class="bi bi-shield-lock-fill text-danger me-1"></i> admin / admin123 <span class="badge bg-danger ms-1">ADMIN</span>
            </button>
            <button type="button" class="demo-chip btn btn-sm" onclick="quickFill('staff', 'staff123')">
                <i class="bi bi-person-badge-fill text-primary me-1"></i> staff / staff123 <span class="badge bg-primary ms-1">STAFF</span>
            </button>
        </div>
    </div>
</main>

<div th:replace="~{fragments/common :: scripts}"></div>

<script>
    function quickFill(user, pass) {
        document.getElementById('loginUsername').value = user;
        document.getElementById('loginPassword').value = pass;
    }
</script>
</body>
</html>
