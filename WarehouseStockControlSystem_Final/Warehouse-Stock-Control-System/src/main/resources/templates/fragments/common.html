<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Warehouse Stock Control System'">Warehouse Stock Control System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark navbar-warehouse mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-boxes"></i></span>
            <span>Warehouse Stock</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''" th:href="@{/}">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'stock'} ? 'active' : ''" th:href="@{/stock}">
                        <i class="bi bi-arrow-left-right"></i> Stock Operations
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${activeTab == 'products'} ? 'active' : ''" th:href="@{/products}">
                        <i class="bi bi-box-seam"></i> Products
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${activeTab == 'suppliers'} ? 'active' : ''" th:href="@{/suppliers}">
                        <i class="bi bi-truck"></i> Suppliers
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${activeTab == 'reports'} ? 'active' : ''" th:href="@{/reports}">
                        <i class="bi bi-file-earmark-bar-graph"></i> Reports
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${activeTab == 'users'} ? 'active' : ''" th:href="@{/users}">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <div class="d-flex align-items-center text-white-50 me-2">
                    <i class="bi bi-person-circle me-1 text-white"></i>
                    <span class="text-white fw-semibold me-2" sec:authentication="name">User</span>
                    <span class="role-badge admin" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="role-badge staff" sec:authorize="hasRole('STAFF')">STAFF</span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-light" type="submit">
                        <i class="bi bi-box-arrow-right"></i> Sign out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="flash" class="mb-4">
    <div class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" th:if="${success}" role="alert">
        <i class="bi bi-check-circle-fill fs-5 text-success"></i>
        <span th:text="${success}">Saved successfully.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-warning alert-dismissible fade show d-flex align-items-center gap-2" th:if="${warning}" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-5 text-warning"></i>
        <div>
            <strong>Attention:</strong> <span th:text="${warning}"></span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" th:if="${error}" role="alert">
        <i class="bi bi-x-circle-fill fs-5 text-danger"></i>
        <div>
            <strong>Error:</strong> <span th:text="${error}"></span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<footer th:fragment="footer" class="mt-auto py-3 bg-white border-top">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <span class="text-muted small">
            <strong>Warehouse Stock Control System</strong> &bull; SYBSc Computer Science (Sean &amp; Devan)
        </span>
        <span class="text-muted small">
            Spring Boot &bull; Thymeleaf &bull; Spring Security &bull; MySQL JDBC
        </span>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Live client-side table filter function (invocable via oninput/onkeyup or event listeners)
        function filterTable(inputId, tableId) {
            const input = document.getElementById(inputId);
            const table = document.getElementById(tableId);
            if (!input || !table) return;
            const filter = input.value.toLowerCase().trim();
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                if (row.classList.contains('no-filter') || row.classList.contains('empty-state-row')) return;
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        // Automatic table search setup
        function setupTableSearch(inputId, tableId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.addEventListener('input', () => filterTable(inputId, tableId));
            input.addEventListener('keyup', () => filterTable(inputId, tableId));
        }

        // Client-side form validation
        (() => {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</div>
</body>
</html>
