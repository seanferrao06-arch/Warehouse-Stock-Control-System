spring.application.name=warehouse-stock-control-system

# Server Configuration: binds to dynamic $PORT on Vercel/cloud, defaults to 80 locally
server.port=${PORT:80}
server.address=0.0.0.0

# Lazy initialization: allows instant container boot (< 2s) to prevent Vercel initialization timeout
spring.main.lazy-initialization=true

# Database Configuration (Pure JDBC against MySQL 8.x / TiDB Cloud)
# Allows granular env vars (DB_HOST, DB_PORT, DB_NAME, DB_USE_SSL) or full SPRING_DATASOURCE_URL override
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:warehouse_stock}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Fast & Non-blocking Cloud Configuration
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Web & Session
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m